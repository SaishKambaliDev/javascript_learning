<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <script>
        function passmeinfo(username, cb) {
            setTimeout(function () {
                console.log("Fetching username....");
                cb({username});
            }, 2000);
        }

        function profilelekeaaoe(username, cbb) {
            setTimeout(function () {
                cbb({
                    user_id: 123,
                    username,
                });
            }, 2000);
        }

        passmeinfo("saish", function (dets) {
            profilelekeaaoe(dets.username, function (obj) {
                console.log(obj);
            });
        })

    </script>
</body>

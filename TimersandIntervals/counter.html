<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>
    <div>
        <h1>Countdown: <span> </span></h1>
    </div>
    
    <script>
        let count = 10;

        let tm = setInterval(function(){
            if(count >= 0){
            document.querySelector("span").textContent = count;
            count--;
        }
        else{
            clearInterval(tm);
        }
        }, 1000);
    </script>


</body>

</html>

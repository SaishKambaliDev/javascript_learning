<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let bank = (function () {
            let bankbalance = 120000;

            function checkbalance() {
                console.log(bankbalance);
            }

            function deposit(value) {
                bankbalance += deposit;
                console.log('deposited ${value}, Current balance is ${bankbalance}');
            }

            function withdraw(value) {
                bankbalance -= value;
                console.log(`Money withdrawn successfully, current balance is ${bankbalance}`);
            }

            return {
                check: checkbalance,
                dep: deposit,
                with: withdraw,
            };
        })();
    </script>
</body>

</html>

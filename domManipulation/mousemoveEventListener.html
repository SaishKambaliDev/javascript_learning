<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Gilroy";
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        body{
            overflow: hidden;
            position: relative;
        }

        /* never use this on body but on main tag */

        #abcd {
            position: absolute;  /*  without this the div will not move */
            transition: all cubic-bezier(0.19, 1, 0.22, 1) .2s;
            background-Color: red;
            height: 400px;
            width: 400px;
        }
    </style>
</head>

<body>
    <div id="abcd">

    </div>
    <script>
        let abcd = document.querySelector("#abcd");

        window.addEventListener("mousemove", function (dets) {
            abcd.style.top = dets.clientY + "px";
            abcd.style.left = dets.clientX + "px";
        });
    </script>
</body>

</html>

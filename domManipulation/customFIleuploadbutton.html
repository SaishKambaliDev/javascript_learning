<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "GIlroy";
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        #main {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #222;
        }

        input{
            display: none;
        }

        #btn{
            padding: 22px 12px;
            background-color: rgb(0, 90, 0);
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        #main #btn:hover{
            background-color: rgb(0, 39, 0);
            user-select: none;
        }
        
    </style>
</head>

<body>

    <div id="main">
        <input id="fileinp" type="file">
        <div id="btn">
            Upload files
        </div>
    </div>

    <script>

        let fileinp = document.querySelector("#fileinp");
        let btn = document.querySelector("#btn");
        document.querySelector("#btn").addEventListener("click", function(data)
    {
        fileinp.click();
    });

    fileinp.addEventListener("change", function(data){
        console.log(data);
        const filen = data.target.files[0];
        if(filen)
    {
        btn.textContent = filen.name;
    }
    });
        
    </script>
</body>

</html>
